name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Системные зависимости (ffmpeg, шрифты отчётов)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libglib2.0-0 fonts-dejavu-core
      - name: Установка Python-зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Тесты (pytest)
        working-directory: backend
        env:
          STREAM_TARGET_FPS: "4"
        run: python -m pytest tests -q

  frontend:
    name: Frontend · tsc + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Установка зависимостей
        working-directory: frontend
        run: npm ci
      - name: Проверка типов
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Production-сборка
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker · backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа backend
        run: docker build -f backend/Dockerfile -t school-security-backend:ci .
