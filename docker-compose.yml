services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/setup_env.py first}
      POSTGRES_DB: school_security
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school_security"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No host port. Keep this service inside the trusted Compose network.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg2://school:${POSTGRES_PASSWORD}@db:5432/school_security
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/media
      ENABLE_LOCAL_TRAINING: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./media:/app/media
      - ./ml:/app/ml
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 60s

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.services.tasks.celery_app worker --loglevel=info --concurrency=1 --pool=solo
    restart: unless-stopped
    env_file: .env
    environment: *backend_env
    volumes:
      - ./media:/app/media
      - ./ml:/app/ml
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
